<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bola Pintas Kotak</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{width:100vw;height:100vh;background:#0a0a0a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none;user-select:none}
#ball{width:54px;height:54px;position:fixed;left:20px;top:55%;background:rgba(255,255,255,0.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.28);border-radius:14px;z-index:9999;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,0.45)}
#ball::after{content:'';width:20px;height:20px;background:rgba(255,255,255,0.92);border-radius:4px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:9998;display:none}
#overlay.show{display:block}
#menu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.85);width:280px;background:rgba(28,28,30,0.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:24px;padding:18px 14px;z-index:9999;display:none;opacity:0;transition:all 0.28s cubic-bezier(0.175,0.885,0.32,1.275);border:1px solid rgba(255,255,255,0.12)}
#menu.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:rgba(255,255,255,0.09);border-radius:14px;padding:14px 4px;text-align:center;color:#fff;font-size:10px;font-weight:500;letter-spacing:0.2px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border:1px solid rgba(255,255,255,0.05)}
.item:active{transform:scale(0.92);background:rgba(255,255,255,0.18)}
.item svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.volume-box{margin-top:14px;background:rgba(255,255,255,0.09);border-radius:14px;padding:12px 12px 10px;border:1px solid rgba(255,255,255,0.05)}
.volume-box .label{color:rgba(255,255,255,0.55);font-size:10px;letter-spacing:0.6px;font-weight:600;display:flex;justify-content:space-between}
input[type=range]{width:100%;margin-top:10px;accent-color:#fff;height:4px}
#close{margin-top:14px;text-align:center;color:rgba(255,255,255,0.45);font-size:11px;padding:6px;letter-spacing:0.5px}
</style>
</head>
<body>
<div id="overlay" onclick="toggleMenu()"></div>
<div id="ball"></div>
<div id="menu">
<div class="grid">
<div class="item" onclick="act('restart')"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Restart</div>
<div class="item" onclick="act('lock')"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Kunci Layar</div>
<div class="item" onclick="act('screenshot')"><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>Screenshot</div>
<div class="item" onclick="act('volume_up')"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>Vol Up</div>
<div class="item" onclick="act('volume_down')"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>Vol Down</div>
<div class="item" onclick="act('mute')"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>Mute</div>
</div>
<div class="volume-box"><div class="label"><span>VOLUME MEDIA</span><span id="volLabel">7</span></div><input type="range" id="vol" min="0" max="15" value="7" oninput="onVol(this.value)"></div>
<div id="close" onclick="toggleMenu()">TUTUP</div>
</div>
<script>
const ball=document.getElementById('ball'),menu=document.getElementById('menu'),overlay=document.getElementById('overlay'),volLabel=document.getElementById('volLabel');
let isDragging=false,hasDragged=false,startX,startY,initialX,initialY;
function toggleMenu(){if(menu.classList.contains('show')){menu.classList.remove('show');overlay.classList.remove('show');setTimeout(()=>{menu.style.display='none';overlay.style.display='none';},200);}else{menu.style.display='block';overlay.style.display='block';setTimeout(()=>{menu.classList.add('show');overlay.classList.add('show');},10);}}
ball.addEventListener('touchstart',e=>{isDragging=true;hasDragged=false;startX=e.touches[0].clientX;startY=e.touches[0].clientY;let r=ball.getBoundingClientRect();initialX=r.left;initialY=r.top;},{passive:false});
ball.addEventListener('touchmove',e=>{if(!isDragging)return;e.preventDefault();let dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(Math.abs(dx)>6||Math.abs(dy)>6)hasDragged=true;ball.style.left=(initialX+dx)+'px';ball.style.top=(initialY+dy)+'px';},{passive:false});
ball.addEventListener('touchend',()=>{isDragging=false;if(!hasDragged)toggleMenu();let r=ball.getBoundingClientRect();let snapLeft=r.left<window.innerWidth/2;ball.style.transition='left 0.25s';ball.style.left=snapLeft?'12px':(window.innerWidth-66)+'px';setTimeout(()=>ball.style.transition='',300);});
function act(t){if(window.Android&&window.Android.performAction){window.Android.performAction(t);}else{console.log('ACTION:',t);alert(t);}toggleMenu();}
function onVol(v){volLabel.textContent=v;if(window.Android&&window.Android.setVolume){window.Android.setVolume(parseInt(v));}}
</script>
</body>
                                                                   </html>
